<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" flood-color="#0F172A"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 지갑 본체 그림자 및 형태 -->
  <g filter="url(#shadow)">
    <!-- 지갑 메인 바디 -->
    <rect x="96" y="148" width="320" height="236" rx="36" fill="#FFFFFF"/>
    
    <!-- 지갑 윗부분 라인 -->
    <path d="M96 216 H416" stroke="#E2E8F0" stroke-width="6"/>

    <!-- 지갑 잠금 포켓 플랩 -->
    <path d="M280 236 H400 C413.255 236 424 246.745 424 260 V272 C424 285.255 413.255 296 400 296 H280 C266.745 296 256 285.255 256 272 V260 C256 246.745 266.745 236 280 236 Z" fill="#2563EB"/>
    
    <!-- 잠금 단추 (골드 코인) -->
    <circle cx="304" cy="266" r="14" fill="url(#sparkleGrad)"/>
    <circle cx="304" cy="266" r="7" fill="#FBBF24"/>
  </g>

  <!-- 스마트 AI 스파클(반짝임) 별 장식 -->
  <g transform="translate(372, 92) scale(1.3)">
    <path d="M0 24 C14 22 22 14 24 0 C26 14 34 22 48 24 C34 26 26 34 24 48 C22 34 14 26 0 24 Z" fill="url(#sparkleGrad)"/>
  </g>
  <g transform="translate(84, 108) scale(0.8)">
    <path d="M0 24 C14 22 22 14 24 0 C26 14 34 22 48 24 C34 26 26 34 24 48 C22 34 14 26 0 24 Z" fill="#93C5FD"/>
  </g>
</svg>
